<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1e2421; }
      * { box-sizing: border-box; letter-spacing: 0; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { display: grid; min-height: 100vh; min-height: 100dvh; padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); background: linear-gradient(145deg, #cbdad5, #e8eeeb 58%, #d8e2df); place-items: center; }
      main { width: min(100%, 430px); padding: 24px; border: 1px solid rgb(255 255 255 / 78%); border-radius: 20px; background: rgb(250 253 251 / 72%); box-shadow: 0 24px 70px rgb(26 43 34 / 18%), inset 0 1px 0 rgb(255 255 255 / 74%); backdrop-filter: blur(28px) saturate(145%); }
      .heading { display: flex; align-items: center; gap: 13px; }
      .mark { display: grid; width: 42px; height: 42px; border-radius: 12px; color: #fff; background: #202422; font-size: 20px; font-weight: 750; place-items: center; }
      h1 { margin: 0; font-size: 20px; }
      .sub { margin: 4px 0 0; color: #69736d; font-size: 11px; }
      form { margin-top: 24px; }
      label { display: block; margin-bottom: 7px; color: #5e6963; font-size: 11px; font-weight: 700; }
      input { width: 100%; height: 46px; padding: 0 12px; border: 1px solid rgb(42 58 49 / 15%); border-radius: 11px; outline: none; color: #1e2421; background: rgb(255 255 255 / 67%); font: 14px/1.2 "Cascadia Code", Consolas, monospace; }
      input:focus { border-color: rgb(22 112 78 / 60%); box-shadow: 0 0 0 3px rgb(22 112 78 / 10%); }
      button { width: 100%; height: 44px; margin-top: 12px; border: 0; border-radius: 10px; color: #fff; background: #16704e; box-shadow: 0 7px 18px rgb(18 88 61 / 20%); font: 700 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button.secondary { border: 1px solid rgb(42 58 49 / 14%); color: #26332d; background: rgb(255 255 255 / 68%); box-shadow: none; }
      #error { min-height: 18px; margin: 10px 0 0; color: #9a4732; font-size: 11px; }
      .saved { display: flex; align-items: center; gap: 7px; margin-top: 18px; padding-top: 15px; border-top: 1px solid rgb(255 255 255 / 70%); color: #68736d; font-size: 10px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #178156; }
    </style>
  </head>
  <body>
    <main>
      <div class="heading"><div class="mark">G</div><div><h1>Grok Remote</h1><p class="sub">连接你的 Windows 客户端</p></div></div>
      <form id="connect-form">
        <label for="server-url">电脑地址</label>
        <input id="server-url" type="url" inputmode="url" autocomplete="url" placeholder="http://192.168.1.10:2420" required />
        <button type="button" id="scan-button">扫码连接</button>
        <button type="submit" class="secondary">输入地址连接</button>
        <p id="error"></p>
      </form>
      <div class="saved"><span class="dot"></span><span>地址只保存在此设备</span></div>
    </main>
    <script>
      const input = document.querySelector("#server-url");
      const error = document.querySelector("#error");
      const saved = new URLSearchParams(location.search).get("url");
      if (saved) input.value = saved;
      document.querySelector("#scan-button").addEventListener("click", () => {
        if (window.GrokRemoteLauncher?.scanQr) window.GrokRemoteLauncher.scanQr();
        else location.href = "grokremote://scan";
      });
      document.querySelector("#connect-form").addEventListener("submit", (event) => {
        event.preventDefault();
        let value = input.value.trim();
        if (!/^https?:\/\//i.test(value)) value = `http://${value}`;
        try {
          const target = new URL(value);
          if (!target.hostname) throw new Error();
          location.href = `grokremote://connect?url=${encodeURIComponent(target.href)}`;
        } catch {
          error.textContent = "请输入电脑端显示的完整地址";
        }
      });
    </script>
  </body>
</html>
